name: Generate Purple Snake

on:
  schedule:
    
cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      
main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      
name: Generate purple snake
      uses: Platane/snk/svg-only@v3
      with:
        github_user_name: VictorPenaroti
        outputs: |
          dist/github-snake.svg?color_snake=%23A855F7&color_dots=%23171717,%233B0764,%236D28D9,%239333EA,%23C084FC

      
name: Publish snake
      uses: crazy-max/ghaction-github-pages@v3
      with:
        target_branch: output
        build_dir: dist
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
